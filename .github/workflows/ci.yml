name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'  # nightly at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_VERSION: 2.27.0

jobs:
  smoke-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env

      - name: Run pytest smoke tests (unit + api, excluding ai)
        run: python -m pytest -m "unit or api" --tb=short

      - name: Run Robot Framework smoke tests
        run: python -m robot --outputdir temps/robot_smoke tests/robot_tests/

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            temps/allure-results/
            temps/robot_smoke/
          if-no-files-found: warn
          retention-days: 14

  regression-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep headless in pipelines to avoid UI prompts/failures.
      PW_HEADLESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Still needed on a cache hit: --with-deps installs the OS packages.
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Run pytest regression tests (excluding ai)
        run: python -m pytest -m "not ai" --tb=short --maxfail=5

      - name: Run Robot Framework regression tests
        run: python -m robot --outputdir temps tests/robot_tests/

      - name: Install Allure CLI
        run: |
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: allure generate temps/allure-results -o allure-report --clean

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            temps/allure-results/
            temps/artifacts/playwright/
            allure-report/
            temps/log.html
            temps/report.html
            temps/output.xml
          if-no-files-found: warn
          retention-days: 21
