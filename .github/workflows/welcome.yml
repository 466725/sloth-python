name: Welcome Contributors

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thank you for opening your first issue in Sloth Python.

            A maintainer will review it shortly. Please include:
            - A clear description of the problem or request
            - Steps to reproduce, when applicable
            - Relevant logs, screenshots, or test output

            Before opening another issue, please check the existing [issues](https://github.com/466725/sloth-python/issues) and the [README](https://github.com/466725/sloth-python#readme).
          pr-message: |
            Thank you for opening your first pull request in Sloth Python.

            Before review, please make sure:
            - The title clearly describes the change
            - The description explains what changed and why
            - Relevant tests are included or updated
            - The checks pass locally and in GitHub Actions

            A maintainer will review your pull request soon. Thank you for contributing.

