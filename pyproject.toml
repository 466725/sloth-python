[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"
extend-exclude = """
(
  ^/.venv
  | ^/temps
  | ^/.pytest_cache
  | ^/.idea
)
"""

[tool.isort]
profile = "black"
line_length = 100
py_version = 312
skip = [".venv", "temps", ".pytest_cache", ".idea"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "temps", ".pytest_cache", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = ["--alluredir=temps/allure-results", "--clean-alluredir", "--strict-markers"]
testpaths = ["pytest_tests", "robot_tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
  "ai: AI-generated Playwright test script",
  "ui: UI or end-to-end test",
  "api: API or backend integration test",
  "unit: unit-level test",
  "ddt: data-driven test",
  "debug: work-in-progress or debugging-focused test",
  "playwright: Playwright-based UI test",
  "qtest_id(id): qTest test case id used by the pytest qTest reporting hook",
]
log_file = "temps/allure-results/log/pytest.log"
log_file_level = "info"
log_file_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
