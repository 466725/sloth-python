# Advanced model-routing example for DSA.
#
# Setup:
# 1. Copy this file to the repository root (for example, litellm_config.yaml).
# 2. Set LITELLM_CONFIG=./litellm_config.yaml in your environment.
# 3. Set LITELLM_MODEL to one of the model_name aliases declared below.
# 4. Set the referenced provider API key in the process environment.
#
# DSA reads model_list from this file and builds its own LiteLLM Router.
# router_settings and other proxy-server settings are not consumed by DSA.
# This file takes precedence over LLM_CHANNELS and legacy provider keys when
# it loads successfully and contains at least one model deployment.
#
# Secret references in litellm_params use the form:
#   api_key: os.environ/PROVIDER_API_KEY
# DSA resolves this syntax while loading the YAML. If the variable is unset,
# the resolved key is empty and requests to that deployment will fail.
# Do not put real API keys in this file or commit them to source control.
#
# LiteLLM configuration reference:
# https://docs.litellm.ai/docs/proxy/configs

model_list:
  # OpenAI-compatible gateway. Replace the model ID and URL with values
  # supported by your account and gateway.
  - model_name: openai/gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/AIHUBMIX_KEY
      api_base: https://aihubmix.com/v1

  # DeepSeek official API. The top-level model_name is the routing alias
  # selected by LITELLM_MODEL; litellm_params.model is the provider model.
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # Gemini official API. To load-balance multiple keys for this model, add
  # another deployment with the same model_name and model, but a different key.
  - model_name: gemini/gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  # Anthropic official API (optional example).
  # - model_name: anthropic/claude-sonnet-4-6
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-6
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # OpenRouter via its OpenAI-compatible endpoint (optional example).
  # - model_name: openai/~anthropic/claude-sonnet-latest
  #   litellm_params:
  #     model: openai/~anthropic/claude-sonnet-latest
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1

  # Local Ollama (optional example; the host must be reachable by the backend).
  # - model_name: ollama/qwen3:8b
  #   litellm_params:
  #     model: ollama/qwen3:8b
  #     api_base: http://127.0.0.1:11434
